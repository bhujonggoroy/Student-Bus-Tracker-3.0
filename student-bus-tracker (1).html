<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Bus Tracker</title>
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: Arial, "Noto Sans Bengali", sans-serif;
            background: #f3f5f7;
            color: #222
        }

        header {
            background: #075e54;
            color: #fff;
            padding: 25px 15px;
            text-align: center
        }

        header h1 {
            margin: 0;
            font-size: 30px
        }

        header p {
            margin: 8px 0 0;
            font-size: 18px
        }

        nav {
            background: #fff;
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .08)
        }

        nav button {
            border: 0;
            background: #eef1f1;
            padding: 13px 22px;
            border-radius: 13px;
            font-size: 16px;
            cursor: pointer
        }

        nav button.active {
            background: #075e54;
            color: #fff
        }

        .container {
            max-width: 1050px;
            margin: auto;
            padding: 20px
        }

        .page {
            display: none
        }

        .page.active {
            display: block
        }

        .notice {
            background: #fff7dc;
            border-left: 5px solid #e0ae00;
            padding: 15px;
            margin-bottom: 25px;
            font-size: 16px
        }

        .direction-tabs {
            display: flex;
            gap: 15px;
            margin: 15px 0 25px
        }

        .direction-tabs button {
            flex: 1;
            padding: 16px;
            border: 0;
            border-radius: 15px;
            background: #e8eded;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer
        }

        .direction-tabs button.active {
            background: #075e54;
            color: #fff
        }

        .bus-card {
            background: #fff;
            border-left: 7px solid #078477;
            border-radius: 18px;
            padding: 22px;
            margin-bottom: 17px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, .07)
        }

        .bus-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px
        }

        .bus-name {
            font-size: 23px;
            font-weight: bold
        }

        .status {
            font-size: 15px;
            font-weight: bold
        }

        .live {
            color: #168b32
        }

        .location {
            font-size: 19px;
            margin-top: 15px
        }

        .progress {
            margin-top: 12px;
            color: #555;
            font-size: 14px
        }

        .update-time {
            color: #777;
            font-size: 13px;
            margin-top: 8px
        }

        .no-bus {
            background: #fff;
            border-radius: 16px;
            padding: 35px 20px;
            text-align: center;
            color: #777;
            box-shadow: 0 3px 12px rgba(0, 0, 0, .05)
        }

        .card {
            background: #fff;
            padding: 22px;
            border-radius: 16px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, .07)
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold
        }

        select {
            width: 100%;
            padding: 13px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 9px;
            font-size: 16px
        }

        .submit {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            border: 0;
            border-radius: 9px;
            background: #075e54;
            color: #fff;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer
        }

        .submit:disabled {
            opacity: .6;
            cursor: not-allowed
        }

        @media(max-width:600px) {
            header h1 {
                font-size: 24px
            }

            header p {
                font-size: 16px
            }

            nav button {
                padding: 11px 14px;
                font-size: 14px
            }

            .direction-tabs {
                gap: 8px
            }

            .direction-tabs button {
                font-size: 14px;
                padding: 14px 6px
            }

            .bus-name {
                font-size: 20px
            }

            .location {
                font-size: 17px
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>🚌 Student Bus Tracker</h1>
        <p>HSTU • শিক্ষার্থীদের জন্য বাস তথ্য</p>
    </header>
    <nav>
        <button class="active" onclick="showPage('live',this)">🟢 Live</button>
        <button onclick="showPage('schedule',this)">📅 Schedule</button>
        <button onclick="showPage('report',this)">📡 Report</button>
    </nav>
    <div class="container">
        <section id="live" class="page active">
            <div class="notice">ℹ️ এখানে শুধু শিক্ষার্থীদের রিপোর্ট করা বর্তমানে চলমান বাস দেখানো হচ্ছে।</div>
            <h2>🟢 বর্তমানে চলমান বাস</h2>
            <div class="direction-tabs">
                <button id="campusCityBtn" class="active" onclick="changeDirection('campus_city')">🏫 ক্যাম্পাস →
                    শহর</button>
                <button id="boroMathCampusBtn" onclick="changeDirection('boromath_campus')">🏙️ বড় মাঠ →
                    ক্যাম্পাস</button>
            </div>
            <div id="busList"></div>
        </section>
        <section id="schedule" class="page">
            <div class="card">
                <h2>📅 শিক্ষার্থীদের বাস শিডিউল</h2>
                <div id="scheduleFragment">
                    <p id="scheduleStatus" style="text-align:center;color:#777">⏳ শিডিউল লোড হচ্ছে...</p>
                </div>
            </div>
        </section>
        <section id="report" class="page">
            <div class="card">
                <h2>📡 বাসের বর্তমান অবস্থান জানান</h2>
                <label>যাত্রার দিক</label>
                <select id="directionSelect" onchange="updateBusOptions()">
                    <option value="campus_city">🏫 ক্যাম্পাস → শহর</option>
                    <option value="boromath_campus">🏙️ বড় মাঠ → ক্যাম্পাস</option>
                </select>
                <label>বাস নির্বাচন করুন</label><select id="busSelect"></select>
                <label>বাসটি বর্তমানে কোথায়?</label><select id="stopSelect"></select>
                <button class="submit" id="submitBtn" onclick="submitReport()">📡 Update Bus Location</button>
            </div>
        </section>
    </div>
    <!--
        এই স্ক্রিপ্টটা সাধারণ (non-module, Firebase-নির্ভর নয়) —
        তাই নিচের Firebase module script load/fail যাই হোক না কেন,
        পাতা বদলানো (Live/Schedule/Report ট্যাব) ও dropdown সবসময় কাজ করবে।
        আগের bug: showPage() একটা `type="module"` স্ক্রিপ্টের ভেতরে ছিল, আর সেই
        module Firebase import fail করলে পুরোপুরি থেমে যেত, ফলে
        window.showPage কখনো সেট হতো না → "showPage is not defined" error।
    -->
    <script>
        const campusToBoromath = ["Campus", "Gopalganj", "College-mor", "Bus Terminal", "Bot-toli", "Shahi-Masjid", "Bolair-mor", "Sadar-hospital", "Boromath"];
        const boromathToCampus = [...campusToBoromath].reverse();
        let currentDirection = "campus_city";
        const busNames = ["Bus 8", "Bus 11", "Bus 15", "Bus 16", "Bus 17", "Bus 19", "Bus 20", "Bus 21", "বিজয়-১", "বিজয়-২", "বিজয়-৩"];
        // window.buses ব্যবহার করা হচ্ছে (bare `let` নয়) — কারণ নিচের module script
        // আলাদা scope-এ চলে এবং শুধুমাত্র window-এর property হিসেবেই এই data দেখতে পাবে
        window.buses = { campus_city: {}, boromath_campus: {} };

        // ছোট escape helper — XSS ঠেকানোর জন্য (নিরাপত্তা)
        function escapeHtml(str) {
            const div = document.createElement("div");
            div.textContent = String(str ?? "");
            return div.innerHTML;
        }

        let scheduleLoaded = false;
        // শিডিউল fragment আলাদা ফাইল (bus-schedule.html) থেকে fetch করে আনা হয়।
        // Schedule ট্যাবে প্রথমবার ক্লিক করলেই লোড হয় (lazy load) — পেজ খোলার সাথে সাথে না,
        // যাতে শুরুতেই অপ্রয়োজনীয় নেটওয়ার্ক কল না হয়।
        async function loadSchedule() {
            if (scheduleLoaded) return;
            const container = document.getElementById("scheduleFragment");
            try {
                const res = await fetch("bus-schedule.html", { cache: "no-store" });
                if (!res.ok) throw new Error("HTTP " + res.status);
                const html = await res.text();
                container.innerHTML = html;
                scheduleLoaded = true;
            } catch (err) {
                console.error("Schedule load failed:", err);
                container.innerHTML = `<p style="text-align:center;color:#b00020">❌ শিডিউল লোড করা যায়নি। bus-schedule.html ফাইলটি এই পেজের একই ফোল্ডারে আছে কিনা যাচাই করুন, অথবা পেজ রিলোড করুন।</p>`;
            }
        }

        function showPage(id, button) {
            document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
            document.getElementById(id).classList.add("active");
            document.querySelectorAll("nav button").forEach(b => b.classList.remove("active"));
            button.classList.add("active");
            if (id === "schedule") loadSchedule();
        }

        function changeDirection(direction) {
            currentDirection = direction;
            document.getElementById("campusCityBtn").classList.toggle("active", direction === "campus_city");
            document.getElementById("boroMathCampusBtn").classList.toggle("active", direction === "boromath_campus");
            renderBuses();
        }

        function updateBusOptions() {
            const b = document.getElementById("busSelect");
            b.innerHTML = "";
            busNames.forEach((name, i) => {
                const o = document.createElement("option");
                o.value = i;
                o.textContent = name;
                b.appendChild(o);
            });
            updateStopOptions();
        }

        function updateStopOptions() {
            const direction = document.getElementById("directionSelect").value, s = document.getElementById("stopSelect");
            s.innerHTML = "";
            const stops = direction === "campus_city" ? campusToBoromath : boromathToCampus;
            stops.forEach((stop, i) => {
                const o = document.createElement("option");
                o.value = i;
                o.textContent = `${i + 1}. ${stop}`;
                s.appendChild(o);
            });
        }

        function isExpired(bus, direction) {
            if (!bus || !bus.time) return true;
            const minutes = (Date.now() - bus.time) / 60000;
            let limit = 30;
            if (direction === "campus_city" && bus.stopIndex >= 7) limit = 10;
            if (direction === "boromath_campus" && bus.stopIndex >= 6) limit = 20;
            return minutes >= limit;
        }

        // পুরো তালিকা নতুন করে বানায় — data বদলালেই কল হয় (প্রতি সেকেন্ডে না)
        function renderBuses() {
            const list = document.getElementById("busList");
            const data = window.buses[currentDirection] || {};
            if (window.removeExpiredBuses) window.removeExpiredBuses(currentDirection, data);

            const activeNames = Object.keys(data).filter(name => !isExpired(data[name], currentDirection));

            if (!activeNames.length) {
                list.innerHTML = `<div class="no-bus"><div style="font-size:40px">🚌</div><h3>বর্তমানে কোনো বাসের Live update নেই</h3><p>কোনো শিক্ষার্থী বাসের বর্তমান অবস্থান report করলে এখানে দেখা যাবে।</p></div>`;
                return;
            }

            list.innerHTML = activeNames.map(name => {
                const bus = data[name];
                return `<div class="bus-card" data-time="${bus.time}">
                    <div class="bus-header">
                        <div class="bus-name">🚌 ${escapeHtml(bus.name)}</div>
                        <div class="status live">🟢 LIVE</div>
                    </div>
                    <div class="location">📍 ${escapeHtml(bus.stopName)}</div>
                    <div class="progress">Stop ${bus.stopIndex + 1} of 9</div>
                    <div class="update-time"></div>
                </div>`;
            }).join("");

            updateAgoTexts();
        }

        // প্রতি সেকেন্ডে শুধু "কতক্ষণ আগে" টেক্সট বদলায় — পুরো তালিকা re-render হয় না (flicker/lag এড়াতে)
        function updateAgoTexts() {
            document.querySelectorAll("#busList .bus-card").forEach(card => {
                const t = Number(card.dataset.time);
                const sec = Math.floor((Date.now() - t) / 1000);
                const ago = sec < 60 ? `${sec} sec ago` : `${Math.floor(sec / 60)} min ago`;
                card.querySelector(".update-time").textContent = `সর্বশেষ update: ${ago}`;
            });
        }

        async function submitReport() {
            const btn = document.getElementById("submitBtn");
            if (!window.firebaseSaveBus) {
                alert("❌ Firebase এখনো লোড হয়নি বা লোড করা যায়নি। ইন্টারনেট সংযোগ চেক করুন এবং পাতাটি রিলোড করুন।");
                return;
            }
            const direction = document.getElementById("directionSelect").value;
            const busName = busNames[document.getElementById("busSelect").value];
            const stopIndex = Number(document.getElementById("stopSelect").value);
            const stops = direction === "campus_city" ? campusToBoromath : boromathToCampus;

            const busData = {
                name: busName,
                stopIndex: stopIndex,
                stopName: stops[stopIndex],
                time: Date.now()
            };

            btn.disabled = true;
            btn.textContent = "⏳ Updating...";
            try {
                await window.firebaseSaveBus(direction, busName, busData);
                alert("✅ বাসের অবস্থান আপডেট হয়েছে");
                changeDirection(direction);
            } catch (error) {
                console.error("Firebase save error:", error);
                alert("❌ Firebase-এ update করা যায়নি");
            } finally {
                btn.disabled = false;
                btn.textContent = "📡 Update Bus Location";
            }
        }

        setInterval(updateAgoTexts, 1000);
        updateBusOptions();
        renderBuses();
    </script>

    <!--
        Firebase-নির্ভর অংশ আলাদা module script-এ, try/catch দিয়ে wrap করা।
        এটা fail করলেও উপরের স্ক্রিপ্টের কারণে বাকি পুরো পাতা স্বাভাবিকভাবে কাজ করবে,
        শুধু live-location save/sync হবে না।
    -->
    <script type="module">
        try {
            const { initializeApp } = await import("https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js");
            const { getDatabase, ref, set, remove, onValue } = await import("https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js");

            const firebaseConfig = {
                apiKey: "AIzaSyCUO8wN4B_6x_9FOQEm75SafEEjapj9DJs",
                authDomain: "student-bus-tracker-bc55b.firebaseapp.com",
                databaseURL: "https://student-bus-tracker-bc55b-default-rtdb.asia-southeast1.firebasedatabase.app",
                projectId: "student-bus-tracker-bc55b",
                storageBucket: "student-bus-tracker-bc55b.firebasestorage.app",
                messagingSenderId: "1016810702965",
                appId: "1:1016810702965:web:b8789e419f8b15cb00903c",
                measurementId: "G-X31GDZR6TL"
            };

            const app = initializeApp(firebaseConfig);
            const db = getDatabase(app);

            window.firebaseSaveBus = async (direction, busName, busData) => {
                const safeBusName = busName.replace(/[.#$[\]]/g, "_");
                await set(ref(db, `buses/${direction}/${safeBusName}`), busData);
            };

            window.removeExpiredBuses = async (direction, data) => {
                const removals = [];
                Object.keys(data).forEach(name => {
                    if (window.isExpiredCheck && window.isExpiredCheck(data[name], direction)) {
                        removals.push(remove(ref(db, `buses/${direction}/${name}`)).catch(() => {}));
                    }
                });
                if (removals.length) await Promise.all(removals);
            };
            window.isExpiredCheck = (bus, direction) => {
                if (!bus || !bus.time) return true;
                const minutes = (Date.now() - bus.time) / 60000;
                let limit = 30;
                if (direction === "campus_city" && bus.stopIndex >= 7) limit = 10;
                if (direction === "boromath_campus" && bus.stopIndex >= 6) limit = 20;
                return minutes >= limit;
            };

            const busesRef = ref(db, "buses");
            onValue(busesRef, (snapshot) => {
                const data = snapshot.val();
                window.buses = data || { campus_city: {}, boromath_campus: {} };
                if (!window.buses.campus_city) window.buses.campus_city = {};
                if (!window.buses.boromath_campus) window.buses.boromath_campus = {};
                if (typeof window.renderBuses === "function") window.renderBuses();
            });

            setInterval(() => { if (window.buses && window.renderBuses) window.renderBuses(); }, 15000);
        } catch (err) {
            console.error("Firebase load failed:", err);
            // Firebase লোড না হলেও বাকি পাতা (navigation, dropdown) স্বাভাবিক থাকবে —
            // শুধু submitReport() ব্যবহারকারীকে সতর্ক করবে যে live sync কাজ করছে না।
        }
    </script>
</body>

</html>
